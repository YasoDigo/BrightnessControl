[package]
name = "bc-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "BrightnessControl"
path = "src/main.rs"

[dependencies]
bc-core = { path = "../bc-core" }
anyhow.workspace = true
tracing.workspace = true
windows.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
